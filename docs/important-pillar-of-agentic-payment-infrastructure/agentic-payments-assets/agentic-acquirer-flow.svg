<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1980" width="1480" height="1980" role="img" aria-labelledby="title desc">
<title id="title">Agentic Acquirer settlement flow</title>
<desc id="desc">Sequence diagram of instant stablecoin fronting, card clearing one to two days later, and a 120-day chargeback tail the acquirer absorbs alone.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
  </marker>
  <style>
    .actor { fill:#f6efe3; stroke:#d7c9b3; stroke-width:1.2; }
    .actor-title { font:700 11.5px ui-sans-serif,system-ui,sans-serif; fill:#2b2b2b; text-anchor:middle; }
    .actor-sub { font:10px ui-sans-serif,system-ui,sans-serif; fill:#5a5348; text-anchor:middle; }
    .life { stroke:#eadfce; stroke-width:1.15; }
    .life-acq { stroke:#d9920a; stroke-width:1.4; }
    .orange { fill:#f0b429; }
    .band { fill:#f8e7a4; stroke:#ead58a; stroke-width:0.8; }
    .band-wide { fill:#f6e08a; stroke:#e2c96a; stroke-width:0.8; }
    .missing { font:700 11px ui-sans-serif,system-ui,sans-serif; fill:#7a4e00; text-anchor:middle; }
    .msg { stroke:#2b2b2b; stroke-width:1.35; fill:none; marker-end:url(#arrow); }
    .dash { stroke-dasharray:5 3.5; }
    .lbl { font:11px ui-sans-serif,system-ui,sans-serif; fill:#2b2b2b; }
    .lbl-c { font:11px ui-sans-serif,system-ui,sans-serif; fill:#2b2b2b; text-anchor:middle; }
    .note { font:10.5px ui-sans-serif,system-ui,sans-serif; fill:#3a3a3a; }
    .band-txt { font:700 12px ui-sans-serif,system-ui,sans-serif; fill:#5a4308; }
    .band-txt-c { font:700 12px ui-sans-serif,system-ui,sans-serif; fill:#5a4308; text-anchor:middle; }
    .step { fill:#2f2f2f; }
    .step-n { font:700 9.5px ui-sans-serif,system-ui,sans-serif; fill:#fff; text-anchor:middle; }
    .opt { fill:none; stroke:#b8b8b8; stroke-width:1; stroke-dasharray:4 3; }
    .opt-lbl { font:italic 11px ui-sans-serif,system-ui,sans-serif; fill:#666; }
    .sheet { font:10.5px ui-sans-serif,system-ui,sans-serif; fill:#5a4308; text-anchor:middle; }
  </style>
</defs>
<rect width="1480" height="1980" fill="#fff"/>
<rect class="orange" x="638" y="18" width="164" height="1870" rx="6"/>
<text class="missing" x="720" y="36">Missing Layer</text>
<rect class="actor" x="25" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="95" y="62">Buyer's Agent</text><text class="actor-sub" x="95" y="78">(Client)</text><rect class="actor" x="215" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="285" y="62">Seller's Agent</text><text class="actor-sub" x="285" y="78">(Marketplace Server)</text><rect class="actor" x="405" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="475" y="62">x402 Facilitator</text><text class="actor-sub" x="475" y="78"></text><rect class="actor" x="895" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="965" y="62">Ethereum</text><text class="actor-sub" x="965" y="78">(L2 Base → L1)</text><rect class="actor" x="1095" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="1165" y="62">Visa Network</text><text class="actor-sub" x="1165" y="78"></text><rect class="actor" x="1295" y="44" width="140" height="46" rx="6"/><text class="actor-title" x="1365" y="62">Issuer</text><text class="actor-sub" x="1365" y="78">(Cardholder Account)</text><rect class="actor" x="650" y="44" width="140" height="52" rx="6"/><text class="actor-title" x="720" y="62">Agentic Acquirer</text><text class="actor-sub" x="720" y="76">(Fronting Entity /</text><text class="actor-sub" x="720" y="88">Stablecoin Issuer)</text><line class="life" x1="95" y1="86" x2="95" y2="1888"/><line class="life" x1="285" y1="86" x2="285" y2="1888"/><line class="life" x1="475" y1="86" x2="475" y2="1888"/><line class="life-acq" x1="720" y1="86" x2="720" y2="1888"/><line class="life" x1="965" y1="86" x2="965" y2="1888"/><line class="life" x1="1165" y1="86" x2="1165" y2="1888"/><line class="life" x1="1365" y1="86" x2="1365" y2="1888"/><rect class="band" x="30" y="108" width="580" height="22" rx="3"/><text class="band-txt" x="42" y="123">Authentication / ACP implementation</text><rect class="band" x="30" y="134" width="580" height="24" rx="3"/><text class="band-txt" x="42" y="150">Setup: card credential + agent mandate bound to Buyer's Agent, underwritten by Acquirer</text><rect class="band-wide" x="30" y="164" width="1420" height="26" rx="3"/><text class="band-txt-c" x="740" y="182">TIME DOMAIN 1  ·  INSTANT LEG (seconds)</text><line class="msg" x1="95" y1="214" x2="273" y2="214"/><circle class="step" cx="95" cy="214" r="9"/><text class="step-n" x="95" y="217.5">1</text><text class="lbl-c" x="190.0" y="206">Client request</text><line class="msg" x1="285" y1="252" x2="107" y2="252"/><circle class="step" cx="285" cy="252" r="9"/><text class="step-n" x="285" y="255.5">2</text><text class="lbl" x="190.0" y="230" style="text-anchor:middle;"><tspan x="190.0" dy="0">Payment Required (402)</tspan><tspan x="190.0" dy="13">+ payment request parameters</tspan></text><line class="msg" x1="95" y1="304" x2="273" y2="304"/><circle class="step" cx="95" cy="304" r="9"/><text class="step-n" x="95" y="307.5">3</text><text class="lbl" x="190.0" y="282" style="text-anchor:middle;"><tspan x="190.0" dy="0">Request with payment intent</tspan><tspan x="190.0" dy="13">(card-backed, no wallet balance)</tspan></text><line class="msg" x1="285" y1="352" x2="463" y2="352"/><circle class="step" cx="285" cy="352" r="9"/><text class="step-n" x="285" y="355.5">4</text><text class="lbl-c" x="380.0" y="344">Verify request</text><line class="msg" x1="475" y1="400" x2="708" y2="400"/><circle class="step" cx="475" cy="400" r="9"/><text class="step-n" x="475" y="403.5">5</text><text class="lbl" x="587.5" y="378" style="text-anchor:middle;"><tspan x="587.5" dy="0">Funding request</tspan><tspan x="587.5" dy="13">(amount + agent credential)</tspan></text><path class="msg" d="M 720 456 C 762 438 762 474 730 456"/><circle class="step" cx="720" cy="456" r="9"/><text class="step-n" x="720" y="459.5">6</text><text class="lbl" x="770" y="450" style=""><tspan x="770" dy="0">Real-time risk check</tspan><tspan x="770" dy="13">(actuarial loss-rate pricing)</tspan></text><line class="msg" x1="720" y1="512" x2="1153" y2="512"/><circle class="step" cx="720" cy="512" r="9"/><text class="step-n" x="720" y="515.5">7</text><text class="lbl" x="942.5" y="490" style="text-anchor:middle;"><tspan x="942.5" dy="0">Card authorization request</tspan><tspan x="942.5" dy="13">(CNP, agent-initiated)</tspan></text><line class="msg" x1="1165" y1="556" x2="1353" y2="556"/><circle class="step" cx="1165" cy="556" r="9"/><text class="step-n" x="1165" y="559.5">8</text><text class="lbl-c" x="1265.0" y="548">Route auth to issuer</text><line class="msg" x1="1365" y1="600" x2="1177" y2="600"/><circle class="step" cx="1365" cy="600" r="9"/><text class="step-n" x="1365" y="603.5">9</text><text class="lbl-c" x="1265.0" y="592">Approved, funds held</text><line class="msg dash" x1="1165" y1="644" x2="732" y2="644"/><circle class="step" cx="1165" cy="644" r="9"/><text class="step-n" x="1165" y="647.5">10</text><text class="lbl-c" x="942.5" y="636">Authorization approval</text><line class="msg" x1="720" y1="704" x2="487" y2="704"/><circle class="step" cx="720" cy="704" r="9"/><text class="step-n" x="720" y="707.5">11</text><text class="lbl" x="597.5" y="670" style="text-anchor:middle;"><tspan x="597.5" dy="0">Funding committed</tspan><tspan x="597.5" dy="13">(fronted from USDC treasury inventory,</tspan><tspan x="597.5" dy="13">NOT minted against receivable, per GENIUS Act)</tspan></text><line class="msg" x1="475" y1="760" x2="297" y2="760"/><circle class="step" cx="475" cy="760" r="9"/><text class="step-n" x="475" y="763.5">12</text><text class="lbl-c" x="380.0" y="752">Verified</text><line class="msg" x1="285" y1="804" x2="463" y2="804"/><circle class="step" cx="285" cy="804" r="9"/><text class="step-n" x="285" y="807.5">13</text><text class="lbl-c" x="380.0" y="796">Settle request</text><line class="msg" x1="720" y1="860" x2="953" y2="860"/><circle class="step" cx="720" cy="860" r="9"/><text class="step-n" x="720" y="863.5">14</text><text class="lbl-c" x="842.5" y="852">Front USDC into settlement</text><line class="msg" x1="475" y1="904" x2="953" y2="904"/><circle class="step" cx="475" cy="904" r="9"/><text class="step-n" x="475" y="907.5">15</text><text class="lbl-c" x="760.0" y="896">Rollup batch, sign onchain (L1)</text><line class="msg dash" x1="965" y1="948" x2="487" y2="948"/><circle class="step" cx="965" cy="948" r="9"/><text class="step-n" x="965" y="951.5">16</text><text class="lbl" x="740.0" y="926" style="text-anchor:middle;"><tspan x="740.0" dy="0">Transaction confirmed</tspan><tspan x="740.0" dy="13">(onchain finality, irreversible)</tspan></text><line class="msg" x1="475" y1="992" x2="297" y2="992"/><circle class="step" cx="475" cy="992" r="9"/><text class="step-n" x="475" y="995.5">17</text><text class="lbl-c" x="380.0" y="984">Settled</text><line class="msg dash" x1="285" y1="1036" x2="107" y2="1036"/><circle class="step" cx="285" cy="1036" r="9"/><text class="step-n" x="285" y="1039.5">18</text><text class="lbl-c" x="190.0" y="1028">Transaction receipt</text><text class="sheet" x="720" y="1088" style="text-anchor:middle;"><tspan x="720" dy="0">Acquirer balance sheet:</tspan><tspan x="720" dy="13">−USDC inventory / +card receivable</tspan></text><rect class="band-wide" x="802" y="1136" width="648" height="26" rx="3"/><text class="band-txt" x="818" y="1154">TIME DOMAIN 2  ·  CARD CLEARING LEG (T+1 / T+2)</text><line class="msg" x1="1165" y1="1194" x2="1353" y2="1194"/><circle class="step" cx="1165" cy="1194" r="9"/><text class="step-n" x="1165" y="1197.5">19</text><text class="lbl-c" x="1265.0" y="1186">Clearing presentment</text><line class="msg" x1="1365" y1="1238" x2="1177" y2="1238"/><circle class="step" cx="1365" cy="1238" r="9"/><text class="step-n" x="1365" y="1241.5">20</text><text class="lbl-c" x="1265.0" y="1230">Fiat settlement</text><line class="msg" x1="1165" y1="1282" x2="732" y2="1282"/><circle class="step" cx="1165" cy="1282" r="9"/><text class="step-n" x="1165" y="1285.5">21</text><text class="lbl-c" x="942.5" y="1274">Fiat proceeds to Acquirer</text><path class="msg" d="M 720 1340 C 762 1322 762 1358 730 1340"/><circle class="step" cx="720" cy="1340" r="9"/><text class="step-n" x="720" y="1343.5">22</text><text class="lbl" x="770" y="1320" style=""><tspan x="770" dy="0">Replenish USDC inventory,</tspan><tspan x="770" dy="13">receivable closed, spread + float captured</tspan></text><rect class="band-wide" x="802" y="1408" width="648" height="26" rx="3"/><text class="band-txt" x="818" y="1426">TIME DOMAIN 3  ·  RECOURSE TAIL (up to 120 days)</text><rect class="opt" x="798" y="1450" width="656" height="230" rx="4"/><text class="opt-lbl" x="808" y="1468">opt</text><text class="lbl" x="1181" y="1492">[Chargeback filed]</text><circle class="step" cx="1165" cy="1492" r="9"/><text class="step-n" x="1165" y="1495.5">23</text><line class="msg" x1="1165" y1="1540" x2="1353" y2="1540"/><circle class="step" cx="1165" cy="1540" r="9"/><text class="step-n" x="1165" y="1543.5">24</text><text class="lbl" x="1265.0" y="1518" style="text-anchor:middle;"><tspan x="1265.0" dy="0">Dispute (cardholder claims</tspan><tspan x="1265.0" dy="13">agent not authorized)</tspan></text><line class="msg" x1="1165" y1="1592" x2="732" y2="1592"/><circle class="step" cx="1165" cy="1592" r="9"/><text class="step-n" x="1165" y="1595.5">25</text><text class="lbl-c" x="942.5" y="1584">Chargeback debit</text><path class="msg" d="M 720 1654 C 762 1636 762 1672 730 1654"/><circle class="step" cx="720" cy="1654" r="9"/><text class="step-n" x="720" y="1657.5">26</text><text class="lbl" x="770" y="1628" style=""><tspan x="770" dy="0">Absorb loss, no recourse to Seller</tspan><tspan x="770" dy="13">(onchain finality already delivered);</tspan><tspan x="770" dy="13">sub-dollar tickets: eat, don't contest</tspan></text><rect class="band-wide" x="30" y="1724" width="1420" height="48" rx="3"/><text class="band-txt-c" x="740" y="1742" style="text-anchor:middle;"><tspan x="740" dy="0">Seller and Buyer exit at step 18 with finality.</tspan><tspan x="740" dy="13">The Acquirer alone spans all three time domains. That asymmetry is the business.</tspan></text><rect class="actor" x="25" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="95" y="1808">Buyer's Agent</text><text class="actor-sub" x="95" y="1824">(Client)</text><rect class="actor" x="215" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="285" y="1808">Seller's Agent</text><text class="actor-sub" x="285" y="1824">(Marketplace Server)</text><rect class="actor" x="405" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="475" y="1808">x402 Facilitator</text><text class="actor-sub" x="475" y="1824"></text><rect class="actor" x="895" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="965" y="1808">Ethereum</text><text class="actor-sub" x="965" y="1824">(L2 Base → L1)</text><rect class="actor" x="1095" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="1165" y="1808">Visa Network</text><text class="actor-sub" x="1165" y="1824"></text><rect class="actor" x="1295" y="1790" width="140" height="46" rx="6"/><text class="actor-title" x="1365" y="1808">Issuer</text><text class="actor-sub" x="1365" y="1824">(Cardholder Account)</text><rect class="actor" x="650" y="1790" width="140" height="52" rx="6"/><text class="actor-title" x="720" y="1808">Agentic Acquirer</text><text class="actor-sub" x="720" y="1822">(Fronting Entity /</text><text class="actor-sub" x="720" y="1834">Stablecoin Issuer)</text></svg>
